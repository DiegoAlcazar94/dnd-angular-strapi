<div style="font-family: Arial, sans-serif; padding: 20px;">
  <h1>El Tablero de D&D - Aventureros </h1>
  
  <div *ngIf="characters.length === 0">
    <p>Cargando aventureros o no hay personajes creados...</p>
  </div>

  <div style="display: flex; gap: 20px; flex-wrap: wrap;">
    <div *ngFor="let char of characters" style="border: 2px solid #333; padding: 15px; border-radius: 8px; width: 200px; background: #f9f9f9;">
      <h3>{{ char.name || char.attributes?.name }}</h3>
      <p><strong>Clase:</strong> {{ char.characterClass || char.attributes?.characterClass }}</p>
      <p><strong>Nivel:</strong> {{ char.level || char.attributes?.level }}</p>
      <p><strong>HP:</strong> {{ char.hp || char.attributes?.hp }}</p>
    </div>
  </div>
</div>
